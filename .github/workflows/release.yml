# Release packaging for both platforms.
#
# Triggers:
#   * push a tag `v*`   → builds installers and publishes a GitHub Release
#   * workflow_dispatch → build only (artifacts on the run), CUDA optional
#
# Products:
#   Windows: AutoTranslatorSetup-x64-<ver>.exe (Inno Setup, per-user, zero
#            runtime installs: .NET + WinAppSDK self-contained + engines)
#            plus a portable zip;  target OS: Windows 10 2004+ x64
#   macOS:   AutoTranslator-macos-arm64.dmg (drag-to-Applications; signed and
#            notarized when secrets are configured); target OS: macOS 15+
#
# Optional secrets (macOS signing/notarization; skip both for unsigned builds):
#   MACOS_CERTIFICATE_P12      base64 of Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD p12 export password
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID  for notarytool
# (Apple Development certificates only run on registered machines — use a
#  Developer ID certificate for distribution. Unsigned builds require the
#  user to right-click → Open on first launch.)

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (used when not building from a tag)'
        required: false
        default: '0.0.0-dev'
      include_cuda:
        description: 'Windows: also build the CUDA engine (adds ~10 min toolkit setup)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      ENGINES: ${{ inputs.include_cuda && 'cpu,vulkan,cuda' || 'cpu,vulkan' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          if (-not $v -or $env:GITHUB_EVENT_NAME -ne 'push') { $v = "${{ inputs.version }}" }
          if (-not $v) { $v = '0.0.0-dev' }
          "VERSION=$v" | Add-Content $env:GITHUB_ENV

      - name: Install CUDA toolkit
        if: ${{ inputs.include_cuda == true }}
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.6.3'
          method: network

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # protoc (translator-protocol build.rs), Inno Setup (installer), Vulkan
      # SDK (whisper.cpp's vulkan backend needs its shaders/loader at build).
      - name: Install build tools
        run: |
          choco install protoc innosetup -y --no-progress
          if ($env:ENGINES -match 'vulkan') { choco install vulkan-sdk -y --no-progress }
          "PROTOC=$(Get-Command protoc | Select-Object -ExpandProperty Source)" | Add-Content $env:GITHUB_ENV

      - name: Locate Vulkan SDK
        if: ${{ contains(env.ENGINES, 'vulkan') }}
        run: |
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Add-Content $env:GITHUB_ENV

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      # Engines (each an isolated exe + native deps), self-contained publish
      # (.NET + WinAppSDK bundled), VC143 CRT into every engine dir,
      # --engine-info verification, portable zip.
      - name: Build engines and portable app
        run: |
          $list = $env:ENGINES -split ','
          .\scripts\build-windows-portable.ps1 -Engine $list -Configuration Release

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName }
          & $iscc packaging/translator.iss "/DAppVersion=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.VERSION }}
          path: |
            target/installer/AutoTranslatorSetup-x64-*.exe
            target/Translator-windows-x64-portable.zip

  macos:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_EVENT_NAME" != "push" ]; then VERSION="${{ inputs.version }}"; fi
          [ -n "$VERSION" ] || VERSION=0.0.0-dev
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install build tools
        run: brew install protobuf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      # Metal engine (cargo + whisper.cpp with GGML_METAL, shaders embedded),
      # Swift bridge, app bundle (copies engine + bridge into the .app).
      - name: Build engine, bridge and app bundle
        run: |
          ./scripts/build-engines.sh metal
          ./scripts/build-bridge.sh
          ./scripts/build-macos-app.sh

      - name: Import Developer ID certificate
        if: ${{ env.HAS_CERT == 'true' }}
        run: |
          echo "${{ secrets.MACOS_CERTIFICATE_P12 }}" | base64 --decode > cert.p12
          KEYCHAIN=build.keychain-db
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Sign and notarize
        if: ${{ env.HAS_CERT == 'true' }}
        run: |
          IDENTITY=$(security find-identity -p codesigning -v | awk '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY" || { echo 'no Developer ID identity found'; exit 1; }
          codesign --force --deep --options runtime --sign "$IDENTITY" target/AutoTranslatorMac.app
          # Submit for notarization and staple; required for Gatekeeper on
          # machines that have never seen this app.
          ditto -c -k --keepParent target/AutoTranslatorMac.app target/app-for-notarization.zip
          xcrun notarytool submit target/app-for-notarization.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          xcrun stapler staple target/AutoTranslatorMac.app

      - name: Build DMG
        run: |
          STAGING=$(mktemp -d)/dmg
          mkdir -p "$STAGING"
          cp -R target/AutoTranslatorMac.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "AutoTranslator $VERSION" \
            -srcfolder "$STAGING" -ov -format UDZO \
            "target/AutoTranslator-macos-arm64-$VERSION.dmg"
          if [ "$HAS_CERT" = "true" ]; then
            IDENTITY=$(security find-identity -p codesigning -v | awk '/Developer ID Application/ {print $2; exit}')
            codesign --force --sign "$IDENTITY" "target/AutoTranslator-macos-arm64-$VERSION.dmg"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.VERSION }}
          path: target/AutoTranslator-macos-arm64-*.dmg

  release:
    needs: [windows, macos]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoTranslatorSetup-x64-*.exe
            dist/Translator-windows-x64-portable.zip
            dist/AutoTranslator-macos-arm64-*.dmg
            dist/SHA256SUMS.txt
