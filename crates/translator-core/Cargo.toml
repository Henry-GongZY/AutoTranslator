[package]
name = "translator-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Realtime system-audio subtitle core (phase 1: capture -> VAD -> ASR -> subtitles)"

[features]
# On by default so the shipped core can run local Whisper. Remove `whisper`
# (or build with --no-default-features) for a tiny core that only ships mock.
default = ["whisper"]
whisper = ["dep:whisper-rs", "dep:reqwest"]
# Build the core with the whisper.cpp CUDA backend (needs a CUDA toolkit +
# a VS toolset CUDA supports, e.g. VS2022 v143). Set WHISPER_CUDA=1 in the
# build environment; WHISPER_CUDA=0 (or unset) builds a CPU-only core.
cuda = ["whisper", "whisper-rs/cuda"]
blas = ["whisper", "whisper-rs/openblas"]
vulkan = ["whisper", "whisper-rs/vulkan"]
# Build the core with the whisper.cpp Metal backend (macOS / Apple Silicon).
# whisper-rs-sys compiles GGML_METAL with the shader library embedded, so the
# resulting binary is self-contained — no runtime .metallib to ship.
metal = ["whisper", "whisper-rs/metal"]

[dependencies]
translator-protocol.workspace = true

prost.workspace = true
bytes.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local Whisper ASR (whisper.cpp through whisper-rs). CUDA is enabled via the
# WHISPER_CUDA / GGML_CUDA env vars in .cargo/config.toml.
whisper-rs = { version = "0.14", optional = true }
# Used only to fetch the model file on first run. rustls avoids an OpenSSL dep;
# `tokio` gives the async runtime reqwest needs inside the core's event loop.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls",
] }

[[bin]]
name = "translator-core"
path = "src/main.rs"
