# Build configuration for translator-core.
#
# The local Whisper ASR (whisper.cpp, via whisper-rs) uses the GPU when built
# with the CUDA backend. To enable it:
#   1. Install a CUDA toolkit (this machine has 12.6) AND a VS toolset that CUDA
#      supports (VS2022 Build Tools / MSVC v143). VS2026's toolset is NOT supported
#      by CUDA 12.6, which is why the GPU build must use the VS2022 vcvarsall.
#   2. Build with `cargo build --features cuda` and WHISPER_CUDA=1 in the env
#      (see build_core_gpu.bat). The runtime still attempts GPU first and falls
#      back to CPU if CUDA init fails.
#
# When WHISPER_CUDA is unset (or "0") the core builds a CPU-only Whisper.
#
# macOS / Apple Silicon: build the Metal engine with
#   cargo build -p translator-core --release --no-default-features --features metal
# (or scripts/build-engines.sh). whisper-rs-sys compiles GGML_METAL with the
# shader library embedded into the binary, so no runtime .metallib is needed.

